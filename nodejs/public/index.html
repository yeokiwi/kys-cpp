<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>金庸群侠传 kys-cpp</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #000; color: #ddd; font: 20px/1.5 "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; cursor: pointer;
    user-select: none; z-index: 5; text-align: center; padding: 16px; }
  #start .title { font-size: 32px; color: #f0d27a; }
  #start .hint { font-size: 14px; color: #888; max-width: 640px; }
  #start.error { cursor: default; }
  #start.error .msg { color: #f88; white-space: pre-wrap; font-size: 16px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="start">
  <div class="title">金庸群侠传 kys-cpp</div>
  <div class="msg">載入中… Loading…</div>
  <div class="hint"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
